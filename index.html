<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Life Data Bridge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🌐</div>
                <h1>SL Data Bridge</h1>
            </div>
            <div class="status-indicator" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <main class="main-content">
            <div class="panel send-panel">
                <div class="panel-header">
                    <h2>Send to Second Life</h2>
                    <div class="panel-icon">📤</div>
                </div>
                
                <div class="input-group">
                    <label for="messageType">Message Type:</label>
                    <select id="messageType">
                        <option value="chat">Chat Message</option>
                        <option value="command">Command</option>
                        <option value="data">Raw Data</option>
                        <option value="coordinates">Coordinates</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="messageContent">Content:</label>
                    <textarea id="messageContent" placeholder="Enter your message or data here..."></textarea>
                </div>

                <div class="button-group">
                    <button id="sendBtn" class="btn btn-primary">Send Message</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear</button>
                </div>
            </div>

            <div class="panel receive-panel">
                <div class="panel-header">
                    <h2>Received from Second Life</h2>
                    <div class="panel-icon">📥</div>
                    <button id="clearLogBtn" class="btn btn-small">Clear Log</button>
                </div>
                
                <div class="log-container">
                    <div id="messageLog" class="message-log">
                        <div class="log-item system">
                            <span class="timestamp">System</span>
                            <span class="message">Bridge initialized. Waiting for connection...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel stats-panel">
                <div class="panel-header">
                    <h2>Statistics</h2>
                    <div class="panel-icon">📊</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="messagesSent">0</div>
                        <div class="stat-label">Messages Sent</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="messagesReceived">0</div>
                        <div class="stat-label">Messages Received</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="uptime">00:00:00</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="quick-actions">
                <button class="quick-btn" data-type="chat" data-content="Hello from the web!">Quick Hello</button>
                <button class="quick-btn" data-type="command" data-content="/status">Get Status</button>
                <button class="quick-btn" data-type="coordinates" data-content="128,128,22">Send Coords</button>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
